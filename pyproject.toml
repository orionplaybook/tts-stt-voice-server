[project]
name = "tts-stt-voice-server"
version = "0.1.0"
description = "Local OpenAI-compatible speech-to-text and text-to-speech server for Apple Silicon (MLX)"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
# Exact versions of every package (direct and indirect) are pinned in uv.lock; these are floors
# and major-version ceilings. Change them with `voicectl update` (tested, rolled back on failure).
dependencies = [
    "mlx-audio[stt,tts]>=0.6.3,<1",
    "mlx>=0.32.4,<1",
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "python-multipart>=0.0.22,<1",
    # Kokoro (fast tier) text-to-phoneme: misaki, espeak-ng via espeakng-loader (French), and
    # spaCy's English model pinned as a wheel so nothing is downloaded at runtime.
    "misaki[en]>=0.9.4,<1",
    "spacy>=3.8.17,<3.9",  # en-core-web-sm 3.8 below needs spaCy 3.8
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
voice-server = "voiceserver.__main__:main"
voice-tokens = "voiceserver.tokens:main"
voicectl = "voiceserver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "openai>=3.42.1",
]
bench = [
    "jiwer>=4.0.0",
    "psutil>=7.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceserver"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
